    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const from = params.get('from');
        const backLinks = [document.getElementById('back-link-top'), document.getElementById('back-link-bottom')];
        
        const hubMap = {
            'holiday': '../[이벤트] 명절_2026/index.html',
            'family': '../[이벤트] 가정의달_2026/index.html',
            'valentine': '../[이벤트] 발렌타인_2026/index.html',
            'whiteday': '../[이벤트] 화이트데이_2026/index.html'
        };

        if (from && hubMap[from]) {
            backLinks.forEach(link => {
                link.href = hubMap[from];
                link.innerText = '← BACK TO HUB';
            });
        }

        const sections = document.querySelectorAll('section');
        const progressBar = document.querySelector('.progress-bar');
        const observerOptions = { threshold: 0.6 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    sections.forEach(s => s.classList.remove('active'));
                    entry.target.classList.add('active');
                    const index = Array.from(sections).indexOf(entry.target);
                    const progress = ((index + 1) / sections.length) * 100;
                    progressBar.style.width = `${progress}%`;
                }
            });
        }, observerOptions);
        sections.forEach(section => observer.observe(section));
    </script>
