    <meta charset="UTF-8">

<body class="lookbook-page antialiased selection:bg-orange-500/30 theme-halloween">

    <div class="progress-bar"></div>
    <div id="event-description-container" style="display: none;">
        <h1 class="serif text-3xl md:text-5xl mb-8 leading-snug tracking-tight text-white">어둠이 깊어지는 할로윈 밤,<br><span class="text-orange-500">단호박의 달콤함으로 빚어낸 황금빛 위로</span></h1>
    </div>

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 w-full z-50 p-8 flex justify-between items-center pointer-events-none">
        <a href="../index.html" class="nav-item pointer-events-auto serif text-xs tracking-widest transition-opacity" id="back-link">← PORTAL</a>
        <div class="nav-item serif text-sm tracking-[0.4em] font-bold text-orange-500">HALLOWEEN EDITION VOL. 16</div>
    </nav>

    <main id="main-content">
        <!-- 01. Hero -->
        <section class="active">
            <div class="hero-stage">
                <div class="hero-image-area">
                    <img src="KakaoTalk_20251002_082631387_17.jpg" alt="단호박 바스크 메인" class="fade-in-up">
                </div>
                <div class="hero-content-area">
                    <div class="content-box">
                    <span class="serif text-xs tracking-[0.4em] text-orange-400 mb-4 block">Seasonal Selection 2025</span>
                    <h1 class="serif text-6xl md:text-8xl mb-8 tracking-tight text-white" id="hero-title">순두부<br><span class="text-orange-500">단호박 바스크</span></h1>
                </div>
                </div>
            </div>
        </section>

        <!-- 02. Texture -->
        <section>
            <div class="image-stage">
                <img src="KakaoTalk_20251002_082631387_08.jpg" alt="질감 샷">
                <div class="content-box side-left">
                    <h2 class="serif text-4xl mb-6">농도 짙은<br>가을의 맛</h2>
                    <p>단호박의 원물을 그대로 담아낸<br>진득하고 부드러운 할로윈의 텍스처.</p>
                </div>
            </div>
        </section>

        <!-- 03. Mood -->
        <section>
            <div class="image-stage">
                <img src="KakaoTalk_20251002_082631387_02.jpg" alt="무드 샷">
                <div class="content-box side-right">
                    <h2 class="serif text-4xl mb-6">황금빛<br>기다림</h2>
                    <p>오랜 오븐의 열기 속에 완성된<br>순두부와 치즈의 가장 고요한 조화.</p>
                </div>
            </div>
        </section>

        <!-- 04. Outro -->
        <section>
            <div class="image-stage">
                <img src="KakaoTalk_20251002_082631387_18.jpg" alt="최종 샷">
                <div class="content-box side-left">
                    <h2 class="serif text-4xl mb-6">달콤한<br>축제</h2>
                    <p>당신의 할로윈이 가장 건강하고<br>아름다운 맛으로 기억되길 바랍니다.</p>
                </div>
                <!-- 하단 브랜딩 요소 -->
                <div class="content-box centered text-center" style="top: auto; bottom: 10%; transform: translateX(-50%);">
                    
                <div class="lookbook-footer-container">
                    <div class="footer-buttons-trio">
                        <a id="back-link-bottom" href="../index.html" class="back-btn">← 이전화면</a>
                        <a href="../index.html" class="portal-btn btn-accent">메인으로</a>
                        <button onclick="window.close()" class="close-btn">닫기</button>
                    </div>
                </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const sections = document.querySelectorAll('section');
        const progressBar = document.querySelector('.progress-bar');
        const main = document.querySelector('main');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    sections.forEach(s => s.classList.remove('active'));
                    entry.target.classList.add('active');
                    
                    const index = Array.from(sections).indexOf(entry.target);
                    const progress = ((index + 1) / sections.length) * 100;
                    progressBar.style.width = `${progress}%`;
                }
            });
        }, { threshold: 0.6 });

        sections.forEach(section => observer.observe(section));

        // [Dynamic Logic] Event Entry Check
        if (window.location.hash === '#skip-intro') {
            const heroTitle = document.getElementById('hero-title');
            const newDesc = document.getElementById('event-description-container').innerHTML;
            if (heroTitle) heroTitle.outerHTML = newDesc;

            sections[0].style.display = 'none';
            if (sections[1]) sections[1].scrollIntoView();

            const backLinks = [document.getElementById('back-link'), document.getElementById('back-link-bottom')];
            backLinks.forEach(link => {
                if (link) {
                    link.innerText = '← BACK TO EVENT';
                    link.href = '../[이벤트] 할로윈_20251029/index.html';
                }
            });
        }

        window.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
