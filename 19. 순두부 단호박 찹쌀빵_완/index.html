<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할로윈 에디션: 순두부 단호박 찹쌀빵</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style_lookbook.css?v=2.2">
    <style>
        :root {
            --val-accent: #FF6D00; /* halloween-orange */
            --val-dark: #0A0A0A;
            --val-bg: #0A0A0A;
            --text-main: #E0E0E0;
            --text-sub: #BBBBBB;
            --content-bg: rgba(20, 20, 20, 0.9);
            --content-text: #E0E0E0;
        }
    </style>
</head>
</head>
<body class="antialiased selection:bg-orange-500/30">

    <div class="progress-bar"></div>
    <div id="event-description-container" style="display: none;">
        <h1 class="serif text-3xl md:text-5xl mb-8 leading-snug tracking-tight text-white">가을의 풍요로움을 쫀득하게 담아낸<br><span class="text-orange-500">할로윈의 가장 따뜻하고 정겨운 대답</span></h1>
    </div>

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 w-full z-50 p-8 flex justify-between items-center pointer-events-none">
        <a href="../index.html" class="nav-item pointer-events-auto serif text-xs tracking-widest transition-opacity" id="back-link">← PORTAL</a>
        <div class="nav-item serif text-sm tracking-[0.4em] font-bold text-orange-500">HALLOWEEN EDITION VOL. 19</div>
    </nav>

    <main id="main-content">
        <!-- 01. Hero -->
        <section class="active">
            <div class="image-stage">
                <img src="KakaoTalk_20251006_112740688.jpg" alt="단호박 찹쌀빵 메인" class="fade-in-up">
                <div class="hero-content">
                    <span class="serif text-xs tracking-[0.4em] text-orange-400 mb-4 block">Seasonal Selection 2025</span>
                    <h1 class="serif text-6xl md:text-8xl mb-8 tracking-tight text-white" id="hero-title">순두부<br><span class="text-orange-500">단호박 찹쌀빵</span></h1>
                </div>
            </div>
        </section>

        <!-- 02. Texture -->
        <section>
            <div class="image-stage">
                <img src="KakaoTalk_20251002_083711682_04.jpg" alt="질감 샷">
                <div class="content-box side-left">
                    <h2 class="serif text-4xl mb-6">압도적<br>쫀득함</h2>
                    <p>순두부의 수분이 찹쌀과 만나 이루는<br>놀라운 탄력과 다정한 식감.</p>
                </div>
            </div>
        </section>

        <!-- 03. Detail -->
        <section>
            <div class="image-stage">
                <img src="KakaoTalk_20251006_113031878.jpg" alt="디테일 샷">
                <div class="content-box side-right">
                    <h2 class="serif text-4xl mb-6">자연이 준<br>달콤함</h2>
                    <p>단호박 본연의 맛을 살린 속재료가<br>입안 가득 가을의 향기를 채웁니다.</p>
                </div>
            </div>
        </section>

        <!-- 04. Outro -->
        <section>
            <div class="image-stage">
                <img src="KakaoTalk_20251008_092053617.jpg" alt="최종 샷">
                <div class="content-box side-left">
                    <h2 class="serif text-4xl mb-6">축제의<br>조각</h2>
                    <p>한 조각마다 정성이 깃든 찹쌀빵으로<br>포근한 할로윈의 밤을 보내시길.</p>
                </div>
                <!-- 하단 브랜딩 요소 -->
                <div class="content-box centered text-center" style="top: auto; bottom: 8%; left: 50%; transform: translateX(-50%); text-align: center; max-width: 100%; background: transparent; backdrop-filter: none; border: none; box-shadow: none;">
                    <div class="footer-buttons">
                        <a href="../[이벤트] 할로윈_20251029/index.html" class="back-btn serif px-10 py-4 transition-all tracking-widest text-sm inline-block" id="footer-back-link">← BACK TO EVENT</a>
                        <a href="https://blog.naver.com/project_dubu/224044280791" target="_blank" rel="noopener noreferrer" class="blog-btn serif px-10 py-4 tracking-widest text-sm inline-block">상세한 레시피는 블로그로 →</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const sections = document.querySelectorAll('section');
        const progressBar = document.querySelector('.progress-bar');
        const main = document.querySelector('main');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    sections.forEach(s => s.classList.remove('active'));
                    entry.target.classList.add('active');
                    
                    const index = Array.from(sections).indexOf(entry.target);
                    const progress = ((index + 1) / sections.length) * 100;
                    progressBar.style.width = `${progress}%`;
                }
            });
        }, { threshold: 0.6 });

        sections.forEach(section => observer.observe(section));

        // [Dynamic Logic] Event Entry Check
        if (window.location.hash === '#skip-intro') {
            const heroTitle = document.getElementById('hero-title');
            const newDesc = document.getElementById('event-description-container').innerHTML;
            if (heroTitle) heroTitle.outerHTML = newDesc;

            sections[0].style.display = 'none';
            if (sections[1]) sections[1].scrollIntoView();

            const backLinks = [document.getElementById('back-link'), document.getElementById('footer-back-link')];
            backLinks.forEach(link => {
                if (link) {
                    link.innerText = '← BACK TO EVENT';
                    link.href = '../[이벤트] 할로윈_20251029/index.html';
                }
            });
        }

        window.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
