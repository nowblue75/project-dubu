<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할로윈 스페셜: Cinematic Mummy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --halloween-accent: #FF6D00;
            --halloween-dark: #1A0F0A;
            --halloween-text: #F3E5D8;
        }
        body { background-color: var(--halloween-dark); color: var(--halloween-text); transition: all 0.5s ease; overflow: hidden; }
        .progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--halloween-accent); z-index: 1000; transition: width 0.3s ease; }
        
        section { height: 100vh; width: 100%; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; scroll-snap-align: start; }
        main { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }

        .image-stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .image-stage img { 
            max-height: 85vh; 
            max-width: 85vw; 
            object-fit: contain; 
            box-shadow: 0 30px 80px rgba(0,0,0,0.8); 
            border-radius: 4px; 
            border: 1px solid rgba(255,109,0,0.2);
        }

        .serif { font-family: 'Noto Serif KR', serif; }

        /* Navigation */
        .nav-item { color: var(--halloween-accent); opacity: 0.6; transition: opacity 0.3s; }
        .nav-item:hover { opacity: 1; }
        .back-btn { border: 1px solid rgba(255, 109, 0, 0.4); border-radius: 25px; transition: all 0.3s; color: var(--halloween-accent); background: rgba(0,0,0,0.3); }
        .back-btn:hover { background: var(--halloween-accent); color: white; border-color: var(--halloween-accent); }
        .blog-btn { border: 1px solid var(--halloween-accent); border-radius: 25px; transition: all 0.3s; color: white; background: var(--halloween-accent); text-decoration: none; }
        .blog-btn:hover { background: transparent; color: var(--halloween-accent); }
        .footer-buttons { display: flex; gap: 16px; justify-content: center; align-items: center; flex-wrap: wrap; }

        /* Content Boxes - 가독성 강화 (Halloween Dark Glass) */
        .content-box {
            position: absolute;
            z-index: 20;
            padding: 35px 45px;
            max-width: 500px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.2, 1, 0.3, 1) 0.5s;

            /* 가독성 핵심: 다크 글래스모피즘 */
            background: rgba(26, 15, 10, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 109, 0, 0.15);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        .active .content-box { opacity: 1; transform: translateY(0); }
        
        .side-left { left: 8vw; top: 40%; text-align: left; }
        .side-right { right: 8vw; bottom: 40%; text-align: right; }
        
        .content-box h2 {
            font-weight: 700;
            margin-bottom: 1.5rem;
            position: relative;
            padding-left: 20px;
            color: white;
            line-height: 1.3;
        }
        .side-left h2::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--halloween-accent);
            border-radius: 2px;
            box-shadow: 0 0 15px rgba(255,109,0,0.5);
        }
        .side-right h2 { padding-left: 0; padding-right: 20px; }
        .side-right h2::after {
            content: '';
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--halloween-accent);
            border-radius: 2px;
        }

        .content-box p {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #F3E5D8;
            font-weight: 450;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .fade-in-up { animation: fadeInUp 1s ease-out forwards; opacity: 0; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="antialiased selection:bg-orange-500/30">

    <div class="progress-bar"></div>

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 w-full z-50 p-8 flex justify-between items-center pointer-events-none">
        <a href="../[이벤트] 할로윈_20251029/index.html" class="nav-item pointer-events-auto serif text-xs tracking-widest transition-opacity" id="back-link">← BACK TO EVENT</a>
        <div class="nav-item serif text-sm tracking-[0.4em] font-bold text-orange-500">HALLOWEEN EDITION SPECIAL</div>
    </nav>

    <main id="main-content">
        <!-- 01. Hero Close-up (Mummy Brownie) -->
        <section class="active">
            <div class="image-stage">
                <img src="KakaoTalk_20251029_091834561_01.jpg" alt="할로윈 미이라 브라우니" class="fade-in-up">
                <div class="content-box side-right">
                    <h2 class="serif text-4xl mb-6">달콤한<br>공포의 유혹</h2>
                    <p>겹겹이 쌓인 화이트 드리즐 속에서 태어난 미이라.<br>프로젝트 두부가 선사하는 할로윈의 감각적 기록입니다.</p>
                </div>
            </div>
        </section>

        <!-- 02. Premium Mood -->
        <section>
            <div class="image-stage">
                <img src="halloween_mood_premium.png" alt="할로윈 프리미엄 무드">
                <div class="content-box side-left">
                    <h2 class="serif text-4xl mb-6">순수한<br>미학의 집중</h2>
                    <p>오직 디저트가 가진 질감과 형태에 집중합니다.<br>불규칙이 만든 기묘한 조화, 할로윈의 정수입니다.</p>
                </div>
            </div>
        </section>

        <!-- 03. Storytelling Mood + Footer -->
        <section>
            <div class="image-stage">
                <img src="halloween_mood.png" alt="할로윈 스토리텔링">
                <div class="content-box side-right">
                    <h2 class="serif text-4xl">기묘한<br>밤의 산책</h2>
                    <p>어둠 속에서 속삭이는 달콤한 비밀.<br>가장 미스테리하고 다정한 우리만의 할로윈입니다.</p>
                </div>
                <!-- 하단 브랜딩 요소 -->
                <div class="content-box centered text-center" style="top: auto; bottom: 8%; left: 50%; transform: translateX(-50%); text-align: center; max-width: 100%; background: transparent; backdrop-filter: none; border: none; box-shadow: none;">
                    <div class="footer-buttons">
                        <a href="../[이벤트] 할로윈_20251029/index.html" class="back-btn serif px-10 py-4 transition-all tracking-widest text-sm inline-block" id="footer-back-link">← BACK TO EVENT</a>
                        <a href="https://blog.naver.com/project_dubu/224057385035" target="_blank" rel="noopener noreferrer" class="blog-btn serif px-10 py-4 tracking-widest text-sm inline-block">상세한 레시피는 블로그로 →</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const sections = document.querySelectorAll('section');
        const progressBar = document.querySelector('.progress-bar');

        const observerOptions = { threshold: 0.6 };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    sections.forEach(s => s.classList.remove('active'));
                    entry.target.classList.add('active');
                    const index = Array.from(sections).indexOf(entry.target);
                    const progress = ((index + 1) / sections.length) * 100;
                    progressBar.style.width = `${progress}%`;
                }
            });
        }, observerOptions);

        sections.forEach(section => observer.observe(section));
        window.addEventListener('contextmenu', e => e.preventDefault());
        document.querySelectorAll('img').forEach(img => img.addEventListener('dragstart', e => e.preventDefault()));
    </script>
</body>
</html>
