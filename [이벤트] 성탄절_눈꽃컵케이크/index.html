    <style>
        :root {
            --val-accent: #D4AF37; /* 골드 */
            --val-dark: #0D2B1F; /* 딥 다크 그린 */
            --val-bg: #1B4332; /* 성탄절 딥 그린 */
            --text-main: #FFFFFF;
            --text-sub: rgba(255, 255, 255, 0.75);
        }
        body { background-color: var(--val-bg); color: var(--text-main); transition: all 0.5s ease; overflow-x: hidden; font-family: 'Noto Sans KR', sans-serif; }
        .progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--val-accent); z-index: 1000; transition: width 0.3s ease; }
        
        section { height: 100vh; width: 100%; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; scroll-snap-align: start; }
        main { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }

        .image-stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .image-stage img { 
            max-height: 85vh; 
            max-width: 85vw; 
            object-fit: contain; 
            box-shadow: 0 30px 80px rgba(0,0,0,0.5); 
            border-radius: 4px; 
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .serif { font-family: 'Noto Serif KR', serif; }

        /* Navigation */
        .nav-item { color: var(--val-accent); opacity: 0.6; transition: opacity 0.3s; }
        .nav-item:hover { opacity: 1; }
        .back-btn { border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 25px; transition: all 0.3s; color: var(--val-accent); background: rgba(0,0,0,0.2); }
        .back-btn:hover { background: var(--val-accent); color: white; border-color: var(--val-accent); }
        .blog-btn { border: 1px solid var(--val-accent); border-radius: 25px; transition: all 0.3s; color: var(--val-dark); background: var(--val-accent); text-decoration: none; }
        .blog-btn:hover { background: transparent; color: var(--val-accent); }
        .footer-buttons { display: flex; gap: 16px; justify-content: center; align-items: center; flex-wrap: wrap; }

        /* Content Boxes - 가독성 향상 (Dark Glass) */
        .content-box {
            position: absolute;
            z-index: 20;
            padding: 35px 45px;
            max-width: 500px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.2, 1, 0.3, 1) 0.5s;

            background: rgba(13, 43, 31, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        .active .content-box { opacity: 1; transform: translateY(0); }
        
        .side-left { left: 8vw; top: 40%; text-align: left; }
        .side-right { right: 8vw; bottom: 40%; text-align: right; }
        
        .content-box h2 {
            font-weight: 700;
            margin-bottom: 1.5rem;
            position: relative;
            padding-left: 20px;
            color: #FFFFFF;
            line-height: 1.3;
        }
        .side-left h2::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--val-accent);
            border-radius: 2px;
        }
        .side-right h2 { padding-left: 0; padding-right: 20px; }
        .side-right h2::after {
            content: '';
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--val-accent);
            border-radius: 2px;
        }

        .content-box p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-sub);
            font-weight: 450;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .fade-in-up { animation: fadeInUp 1s ease-out forwards; opacity: 0; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <script>
        const sections = document.querySelectorAll('section');
        const progressBar = document.querySelector('.progress-bar');

        const observerOptions = { threshold: 0.6 };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    sections.forEach(s => s.classList.remove('active'));
                    entry.target.classList.add('active');
                    const index = Array.from(sections).indexOf(entry.target);
                    const progress = ((index + 1) / sections.length) * 100;
                    progressBar.style.width = `${progress}%`;
                }
            });
        }, observerOptions);

        sections.forEach(section => observer.observe(section));
        window.addEventListener('contextmenu', e => e.preventDefault());
        document.querySelectorAll('img').forEach(img => img.addEventListener('dragstart', e => e.preventDefault()));
    </script>
