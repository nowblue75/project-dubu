<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>프로젝트 두부 - 리다이렉팅...</title>
    <script type="text/javascript">
        const pathname = window.location.pathname;
        const search = window.location.search;
        const hash = window.location.hash;
        
        const base = '/project-dubu';
        let redirectPath = pathname;
        if (pathname.startsWith(base)) {
            redirectPath = pathname.slice(base.length);
        }
        
        window.location.replace(base + '/?redirect=' + encodeURIComponent(redirectPath) + search + hash);
    </script>
</head>
<body>
</body>
</html>
