<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할로윈 에디션: 순두부 블랙포레스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style_lookbook.css">
    <style>
        :root {
            --val-accent: #9C27B0; /* halloween-purple */
            --val-dark: #0A0A0A;
            --val-bg: #0A0A0A;
            --text-main: #E0E0E0;
            --text-sub: #CCCCCC;
            --content-bg: rgba(26, 26, 26, 0.9);
            --content-text: #E0E0E0;
        }
    </style>
</head>
</head>
<body class="antialiased selection:bg-purple-500/30">

    <div class="progress-bar"></div>
    <div id="event-description-container" style="display: none;">
        <h1 class="serif text-3xl md:text-5xl mb-8 leading-snug tracking-tight text-white">짙은 카카오 숲 속에 숨겨진<br><span class="text-purple-400">가장 매혹적이고 비밀스러운 유혹</span></h1>
    </div>

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 w-full z-50 p-8 flex justify-between items-center pointer-events-none">
        <a href="../index.html" class="nav-item pointer-events-auto serif text-xs tracking-widest transition-opacity" id="back-link">← PORTAL</a>
        <div class="nav-item serif text-sm tracking-[0.4em] font-bold text-purple-400">HALLOWEEN EDITION VOL. 23</div>
    </nav>

    <main id="main-content">
        <!-- 01. Hero -->
        <section class="active">
            <div class="image-stage">
                <img src="0.jpg" alt="블랙포레스트 메인" class="fade-in-up">
                <div class="hero-content">
                    <span class="serif text-xs tracking-[0.4em] text-purple-400 mb-4 block">Seasonal Selection 2025</span>
                    <h1 class="serif text-6xl md:text-8xl mb-8 tracking-tight text-white" id="hero-title">순두부<br><span class="text-purple-500">블랙포레스트</span></h1>
                </div>
            </div>
        </section>

        <!-- 02. Detail -->
        <section>
            <div class="image-stage">
                <img src="KakaoTalk_20251120_165854045.jpg" alt="디테일 샷 1" class="fade-in-up">
                <div class="content-box side-left">
                    <h2 class="serif text-4xl mb-6">검은 숲의<br>그림자</h2>
                    <p>블랙 카카오 섹션의 쌉싸름한 깊이와<br>순두부 크림의 담백한 반전이 만나는 곳.</p>
                </div>
            </div>
        </section>

        <!-- 03. Detail 2 -->
        <section>
            <div class="image-stage">
                <img src="KakaoTalk_20251120_165854045_02.jpg" alt="디테일 샷 2">
                <div class="content-box side-right">
                    <h2 class="serif text-4xl mb-6">붉은빛<br>유혹</h2>
                    <p>어둠 속을 밝히는 선명한 체리 필링의<br>상큼하고 대담한 레이어드.</p>
                </div>
            </div>
        </section>

        <!-- 04. Outro -->
        <section>
            <div class="image-stage">
                <img src="KakaoTalk_20251120_165803876_05.jpg" alt="최종 샷">
                <div class="content-box side-left">
                    <h2 class="serif text-4xl mb-6">침묵의<br>축제</h2>
                    <p>가장 어두운 색으로 빛나는 미학.<br>오직 할로윈만을 위한 특별한 한 조각.</p>
                </div>
                <!-- 하단 브랜딩 요소 -->
                <div class="content-box centered text-center" style="top: auto; bottom: 8%; left: 50%; transform: translateX(-50%); text-align: center; max-width: 100%; background: transparent; backdrop-filter: none; border: none; box-shadow: none;">
                    <div class="footer-buttons">
                        <a href="../[이벤트] 할로윈_20251029/index.html" class="back-btn serif px-10 py-4 transition-all tracking-widest text-sm inline-block" id="footer-back-link">← BACK TO EVENT</a>
                        <a href="https://blog.naver.com/project_dubu/224089622187" target="_blank" rel="noopener noreferrer" class="blog-btn serif px-10 py-4 tracking-widest text-sm inline-block">상세한 레시피는 블로그로 →</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const sections = document.querySelectorAll('section');
        const progressBar = document.querySelector('.progress-bar');
        const main = document.querySelector('main');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    sections.forEach(s => s.classList.remove('active'));
                    entry.target.classList.add('active');
                    
                    const index = Array.from(sections).indexOf(entry.target);
                    const progress = ((index + 1) / sections.length) * 100;
                    progressBar.style.width = `${progress}%`;
                }
            });
        }, { threshold: 0.6 });

        sections.forEach(section => observer.observe(section));

        // [Dynamic Logic] Event Entry Check
        if (window.location.hash === '#skip-intro') {
            const heroTitle = document.getElementById('hero-title');
            const newDesc = document.getElementById('event-description-container').innerHTML;
            if (heroTitle) heroTitle.outerHTML = newDesc;

            sections[0].style.display = 'none';
            if (sections[1]) sections[1].scrollIntoView();

            const backLinks = [document.getElementById('back-link'), document.getElementById('footer-back-link')];
            backLinks.forEach(link => {
                if (link) {
                    link.innerText = '← BACK TO EVENT';
                    link.href = '../[이벤트] 할로윈_20251029/index.html';
                }
            });
        }

        window.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
